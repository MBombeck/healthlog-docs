server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # script-src lists the hashes of the inline scripts of this build
    # ($csp_script_hashes, generated by scripts/csp-hashes.mjs); Pagefind's
    # search index is WebAssembly, hence 'wasm-unsafe-eval'. connect-src names
    # the visit-counting endpoint of public/analytics.js.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' $csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://rybbit.bombeck.io; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
