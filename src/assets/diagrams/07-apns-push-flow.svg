<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">HealthLog APNs push flow with fallback channels</title>
  <desc id="desc">The HealthLog server raises a notification event. If APNs is configured with a .p8 key, key ID, team ID and bundle-id matching the signed iOS app, the server signs a JWT and sends the push to Apple's APNs gateway, which delivers it to the registered iOS device. If APNs is not configured or a device permanently rejects, the server falls back to Telegram, ntfy or Web Push. Push is optional — the app stays fully functional without it.</desc>

  <rect x="0" y="0" width="1200" height="560" fill="#282a36" />

  <text x="600" y="42" fill="#f8f8f2" font-size="22" font-weight="700" text-anchor="middle">Push delivery and fallback</text>
  <text x="600" y="66" fill="#6272a4" font-size="13" text-anchor="middle">APNs is one optional channel; the dispatcher falls through to the others.</text>

  <!-- Event source -->
  <rect x="50" y="110" width="200" height="70" rx="10" fill="#44475a" stroke="#8be9fd" stroke-width="1.5" />
  <text x="150" y="140" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="600">HealthLog server</text>
  <text x="150" y="160" text-anchor="middle" fill="#bd93f9" font-size="11">notification event</text>

  <!-- APNs config gate -->
  <rect x="360" y="90" width="260" height="110" rx="14" fill="none" stroke="#50fa7b" stroke-width="2" />
  <text x="380" y="114" fill="#50fa7b" font-size="13" font-weight="700">APNs configured?</text>
  <rect x="380" y="126" width="220" height="28" rx="7" fill="#44475a" stroke="#50fa7b" stroke-width="1" />
  <text x="490" y="145" text-anchor="middle" fill="#f8f8f2" font-size="11">.p8 + KEY_ID + TEAM_ID + BUNDLE_ID</text>
  <rect x="380" y="160" width="220" height="28" rx="7" fill="#44475a" stroke="#50fa7b" stroke-width="1" />
  <text x="490" y="179" text-anchor="middle" fill="#bd93f9" font-size="11">topic == bundle-id of signed app</text>

  <!-- Apple gateway -->
  <rect x="740" y="100" width="190" height="70" rx="10" fill="#44475a" stroke="#ffb86c" stroke-width="1.5" />
  <text x="835" y="130" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="600">Apple APNs</text>
  <text x="835" y="150" text-anchor="middle" fill="#bd93f9" font-size="11">JWT-signed push gateway</text>

  <!-- Device -->
  <rect x="1000" y="100" width="160" height="70" rx="10" fill="#44475a" stroke="#ffb86c" stroke-width="1.5" />
  <text x="1080" y="130" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="600">iOS device</text>
  <text x="1080" y="150" text-anchor="middle" fill="#bd93f9" font-size="11">native HealthLog app</text>

  <!-- Fallback channels -->
  <rect x="360" y="300" width="800" height="150" rx="14" fill="none" stroke="#bd93f9" stroke-width="2" />
  <text x="380" y="324" fill="#bd93f9" font-size="13" font-weight="700">Fallback channels (no Apple account required)</text>

  <rect x="400" y="346" width="220" height="60" rx="10" fill="#44475a" stroke="#bd93f9" stroke-width="1.5" />
  <text x="510" y="372" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="600">Telegram</text>
  <text x="510" y="392" text-anchor="middle" fill="#bd93f9" font-size="11">bot token · inline buttons</text>

  <rect x="640" y="346" width="220" height="60" rx="10" fill="#44475a" stroke="#bd93f9" stroke-width="1.5" />
  <text x="750" y="372" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="600">ntfy</text>
  <text x="750" y="392" text-anchor="middle" fill="#bd93f9" font-size="11">self-hosted or public topic</text>

  <rect x="880" y="346" width="220" height="60" rx="10" fill="#44475a" stroke="#bd93f9" stroke-width="1.5" />
  <text x="990" y="372" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="600">Web Push</text>
  <text x="990" y="392" text-anchor="middle" fill="#bd93f9" font-size="11">VAPID · browser subscriptions</text>

  <!-- Arrows: happy path -->
  <g stroke="#8be9fd" stroke-width="1.4" fill="none" marker-end="url(#a7-c)">
    <path d="M250 145 L 358 145" />
  </g>
  <g stroke="#50fa7b" stroke-width="1.4" fill="none" marker-end="url(#a7-g)">
    <path d="M620 135 L 738 135" />
    <path d="M930 135 L 998 135" />
  </g>
  <text x="660" y="125" fill="#50fa7b" font-size="11" font-weight="700">configured</text>

  <!-- Arrows: fallback -->
  <g stroke="#bd93f9" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#a7-pu)">
    <path d="M490 200 L 490 344" />
  </g>
  <text x="500" y="270" fill="#bd93f9" font-size="11" font-weight="700">not configured / hard reject</text>

  <!-- Footnote -->
  <text x="600" y="500" fill="#6272a4" font-size="11" text-anchor="middle">A self-hoster's own .p8 only works after rebuilding the app under their own bundle-id and Apple team. Without APNs, push still arrives via the fallback channels.</text>

  <defs>
    <marker id="a7-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8be9fd" /></marker>
    <marker id="a7-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#50fa7b" /></marker>
    <marker id="a7-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bd93f9" /></marker>
  </defs>
</svg>
